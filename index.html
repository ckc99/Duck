<!DOCTYPE html>
<html lang="zh">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金宝山水鸭</title>
<link rel="icon" href="assets/favico.ico" type="image/x-icon">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Alkatra:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <a class="logo-group" href="#top">
      <img class="logo-icon" src="assets/duck-logo.webp" alt="金宝山水鸭">
      <span class="logo">金宝山水鸭</span>
    </a>
    <nav></nav>
  </header>

  <main id="top">
    <!-- ---------- HERO / INTRO ---------- -->
    <section class="hero">
      <img class="hero-bg" src="assets/hero-background.JPG" alt="" aria-hidden="true">
      <div class="hero-text">
        <img class="hero-title-img" src="assets/hero-title.webp" alt="得有山又有水，鸭子才有好油水。">
      </div>
    </section>

    <!-- ---------- JOURNEY / VIDEO ---------- -->
    <section class="journey" id="video">
      <div class="journey-heading">
        <h2>高品质生鲜鸭的<br>培育之道</h2>
      </div>
      <div class="journey-media">
        <div class="journey-video">
          <video src="assets/duckling.mp4" autoplay loop muted playsinline></video>
        </div>
        <div class="journey-stats">
          <div class="stat">
            <span class="stat-label">培养天数</span>
            <span class="stat-value">50天+</span>
          </div>
          <div class="stat">
            <span class="stat-label">每只平均净重</span>
            <span class="stat-value">&gt;2.4kg</span>
          </div>
        </div>
      </div>
      <div class="journey-actions">
        <a class="pill-btn" href="#products">
          我们的产品
          <img src="assets/icon-arrow-right.svg" alt="" aria-hidden="true">
        </a>
        <img class="journey-duckie" src="assets/video-duckie.webp" alt="" aria-hidden="true">
      </div>
    </section>

    <!-- ---------- PRODUCTS SLIDER ---------- -->
    <section class="products" id="products">
      <div class="slider">
        <div class="slide is-active" data-slide="0">
          <img class="slide-bg slide-bg--dim" src="assets/slide1-drone.webp" alt="">
          <div class="slide-inner">
            <h3>新鲜整鸭</h3>
            <p>肉质紧实，皮薄油润</p>
            <a class="pill-btn outline" href="https://wa.me/60122295012?text=I'm%20interested%20in%20raw%20duck." target="_blank" rel="noopener">咨询</a>
          </div>
          <img class="slide-duck" src="assets/slide1-duckie.webp" alt="鲜鸭全禽">
        </div>
        <div class="slide" data-slide="1">
          <div class="slide-inner">
            <h3>鲜切整鸭</h3>
            <p>便于烹调，锁住鲜味本色</p>
            <a class="pill-btn outline" href="https://wa.me/60122295012?text=I'm%20interested%20in%20packaged%20duck" target="_blank" rel="noopener">咨询</a>
          </div>
          <img class="slide-duck slide-duck--packaged" src="assets/slide2-packaged-duck.webp" alt="鸭肉分切">
        </div>
        <div class="slider-dots">
          <button class="dot is-active" data-dot="0" aria-label="新鲜整鸭"></button>
          <button class="dot" data-dot="1" aria-label="鲜切整鸭"></button>
        </div>
        <button class="slider-arrow slider-arrow--prev" aria-label="上一张">
          <img src="assets/icon-arrow-right.svg" alt="">
        </button>
        <button class="slider-arrow slider-arrow--next" aria-label="下一张">
          <img src="assets/icon-arrow-right.svg" alt="">
        </button>
      </div>
    </section>

    <!-- ---------- GALLERY ---------- -->
    <section class="gallery" id="works">
      <div class="gallery-head">
        <h2>山水鸭的诞生</h2>
      </div>

      <div class="origin-cards">
        <div class="origin-cards-track">
          <div class="origin-card">
            <div class="frame">
              <img src="assets/自然放养.webp" alt="自然放养">
              <div class="card-caption">
                <span class="badge">1</span>
                <h3>自然放养</h3>
              </div>
            </div>
          </div>
          <div class="origin-card">
            <div class="frame">
              <img src="assets/自由走动.webp" alt="自由走动">
              <div class="card-caption">
                <span class="badge">2</span>
                <h3>自由走动</h3>
              </div>
            </div>
          </div>
          <div class="origin-card">
            <div class="frame">
              <img src="assets/专属饲料.webp" alt="专属饲料">
              <div class="card-caption">
                <span class="badge">3</span>
                <h3>专属饲料</h3>
              </div>
            </div>
          </div>
          <div class="origin-card">
            <div class="frame">
              <img src="assets/slide1-drone.webp" alt="山水游养">
              <div class="card-caption">
                <span class="badge">4</span>
                <h3>山水游养</h3>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="contact">
    <div class="footer-top">
      <p class="footer-address"><span class="label">地址</span><span class="value">No. 29, Persiaran Industri Bercham 8, Kawasan Perindustrian Ringan Bercham, 31400 Ipoh, Perak.</span></p>
      <div class="footer-icons">
        <a href="mailto:kchong026@gmail.com" aria-label="Email">
          <img src="assets/icon-email.svg" alt="">
        </a>
        <a href="https://wa.me/60122295012" target="_blank" rel="noopener" aria-label="WhatsApp">
          <img src="assets/icon-waicon.webp" alt="">
        </a>
      </div>
    </div>
    <p class="footer-copy">© 2026 金宝山水鸭 · KAMPAR FREE RANGE DUCK</p>
  </footer>

  <script src="https://unpkg.com/lenis/dist/lenis.min.js"></script>
  <script src="main.js" defer></script>
</body>
</html>
